[package]
name = "gummy-grove"
version = "0.1.0"
edition = "2021"
description = "Gummy Grove: a first-person shooter on a native Metal renderer"
license = "MIT"
repository = "https://github.com/jonathangarelick/gummy-grove"

[dependencies]
metal = { version = "0.33", features = ["mps"] }
objc = "0.2"
winit = "0.30"
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
cpal = "0.15"
fontdue = "0.9"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unexpected_cfgs = "allow"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
